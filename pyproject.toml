[project]
name = "pinncfd"
version = "0.1.0"
description = "Physics-informed neural networks for aerodynamics: potential flow around cylinders and airfoils, neuroevolutionary architecture search, surrogate benchmarks against a panel method, and an exploratory steady Euler solver."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri", email = "gmcavalheri@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "aero",
]

# PyTorch comes from the PyTorch indexes: CPU wheels for CI and laptops without a GPU,
# CUDA 13.2 wheels (they still ship Turing sm_75 kernels, e.g. the RTX 2060) for training.
[project.optional-dependencies]
cpu = ["torch==2.15.0"]
cu132 = ["torch==2.15.0"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
# AERO-01 (panel method, NACA/Joukowski geometry), pinned to the commit this project was built
# against. Imported only from src/pinncfd/external/.
aero = { git = "https://github.com/GMCavalheri/aerodynamics-from-scratch", rev = "44758a4a134034440eeb78ded7a17b5e528933cd" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinncfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",    # single-letter math names (l, I) are idiomatic here
    "SIM300",  # false positives on uppercase math attributes
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts import their sibling helper module directly
known-local-folder = ["common"]
